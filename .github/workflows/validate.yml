# Runs the data validator on every PR and push. Deployment is handled by Cloudflare Pages.
name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/validate.mjs
